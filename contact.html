<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Letter A Words</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <style>
    .contact-container { padding: 140px 0 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .contact-info h1 { font-size: 3rem; margin-bottom: 20px; color: var(--text); }
    .contact-info p { color: var(--text2); margin-bottom: 30px; }
    .info-box { 
      background: var(--bg3); 
      padding: 24px; 
      border-radius: var(--radius); 
      border: 2px solid var(--border2);
      margin-bottom: 20px;
    }
    .info-box h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 5px; }
    .info-box a { font-weight: 700; color: var(--text); }
    
    .contact-form { 
      background: var(--surface); 
      padding: 40px; 
      border-radius: var(--radius-lg); 
      border: 2px solid var(--border);
      box-shadow: var(--shadow-lg);
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--text2); }
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid var(--border); 
      border-radius: var(--radius-sm);
      outline: none;
      font-family: var(--font-body);
    }
    .form-group input:focus { border-color: var(--secondary); }
    
    @media (max-width: 900px) {
      .contact-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="site-header" role="banner"></header>

  <main class="container">
    <div class="contact-container">
      <div class="contact-info animate-on-scroll">
        <div class="section-tag">Get in Touch</div>
        <h1>Let's Chat!</h1>
        <p>Have a suggestion for a new "A" word or want to collaborate? I'd love to hear from you. As a developer and SEO expert, I'm always looking for ways to improve this tool[cite: 2].</p>
        
        <div class="info-box">
          <h3>Email Michael</h3>
          <a href="mailto:qgqgqhqyus@gmail.com">qgqgqhqyus@gmail.com</a>
        </div>
        
        <div class="info-box">
          <h3>Response Time</h3>
          <p style="margin-bottom:0">Typically within 24-48 business hours.</p>
        </div>
      </div>

      <div class="contact-form animate-on-scroll animate-delay-1">
        <form action="#">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com" required />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="How can I help you?" required></textarea>
          </div>
          <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer" role="contentinfo"></footer>
  <script src="components/header.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/app.js"></script>  
</body>
</html>
